
name: Collect public intelligence

on:
  workflow_dispatch:
  schedule:
    - cron: '23 0,4,8,12,16,20 * * *'

permissions:
  contents: write

concurrency:
  group: collect-public-intelligence
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Retrieve public intelligence and security feeds
        run: python scripts/collect.py

      - name: Build normalized intelligence and briefings
        run: python scripts/intelligence.py

      - name: Commit updated public data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m "Update public intelligence data"
            git push
          fi
